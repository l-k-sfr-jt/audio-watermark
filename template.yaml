AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Forensic audio watermarking service — embeds a buyer order ID into audiobooks

Parameters:
  CFPrivateKeyParam:
    Type: String
    Default: "/audio-watermark/cf-private-key"
    Description: "SSM SecureString path for the CloudFront signing private key PEM (set by deploy.sh)."
  CFPublicKeyParam:
    Type: String
    Default: "/audio-watermark/cf-public-key"
    Description: "SSM String path for the CloudFront signing public key PEM (set by deploy.sh)."

# This template provisions everything the service needs so the only step after
# `sam deploy` is configuring the returned API base URL and key in your plugin:
#   - S3 bucket (masters/ permanent; orders/ 30-day auto-expiry)
#   - the watermarking Lambda (container image) with least-privilege IAM
#   - an API Gateway with two endpoints behind an API key
#     POST /products/upload-url  — admin uploads a master
#     POST /watermark            — order processing + re-download (idempotent)
#
# Deploy with the helper script:  ./scripts/deploy.sh

Resources:
  # ----- Storage ------------------------------------------------------------
  AudioBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          # Buyer copies are re-created from the master on demand, so there is
          # no reason to keep them forever. Auto-delete after 30 days to control
          # storage cost while still serving repeat downloaders for a month.
          - Id: ExpireBuyerCopies
            Status: Enabled
            Prefix: orders/
            ExpirationInDays: 30
          # With versioning enabled, expired current versions become non-current.
          # Delete those quickly too so old buyer copies don't linger.
          - Id: PurgeOldBuyerVersions
            Status: Enabled
            Prefix: orders/
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
      # CORS is required so the WordPress admin page can PUT master audio files
      # directly from the browser to the presigned S3 URL without going through
      # WordPress (which would time out on large files). Only PUT on masters/ is
      # needed; orders/ presigned GETs are fetched by the browser via redirect,
      # not XHR, so no CORS rule is needed there.
      # Add your WordPress domain(s) to AllowedOrigins. The wildcard below works
      # during development; tighten to explicit origins in production if preferred.
      CorsConfiguration:
        CorsRules:
          - AllowedMethods:
              - PUT
            AllowedOrigins:
              - "https://www.dobradetektivka.cz"
              - "https://dobradetektivka.cz"
            AllowedHeaders:
              - "Content-Type"
            MaxAge: 3000

  # ----- S3 bucket policy (allows CloudFront OAC to read orders/) -----------
  # Must be a separate resource so it can reference the CloudFront distribution ARN.
  AudioBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AudioBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${AudioBucket}/orders/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  # ----- CloudFront delivery (egress 1 TB/month free; ~$0.085/GB after) ----
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Public key for signed URL verification.  The PEM is read from SSM
  # (put there by deploy.sh) via a CloudFormation dynamic reference.
  CloudFrontPublicKey:
    Type: AWS::CloudFront::PublicKey
    Properties:
      PublicKeyConfig:
        CallerReference: !Sub "${AWS::StackName}-cf-pubkey-v1"
        Name: !Sub "${AWS::StackName}-signing-key"
        EncodedKey: !Sub "{{resolve:ssm:${CFPublicKeyParam}}}"

  CloudFrontKeyGroup:
    Type: AWS::CloudFront::KeyGroup
    Properties:
      KeyGroupConfig:
        Name: !Sub "${AWS::StackName}-key-group"
        Items:
          - !Ref CloudFrontPublicKey

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} buyer audio delivery"
        # PriceClass_100: NA + Europe (includes CZ) — cheapest tier.
        PriceClass: PriceClass_100
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt AudioBucket.RegionalDomainName
            S3OriginConfig: {}
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: https-only
          # All requests must carry a valid signed URL — enforces auth at edge.
          TrustedKeyGroups:
            - !Ref CloudFrontKeyGroup
          # CachingDisabled managed policy (no caching — files are per-buyer).
          # Egress savings still apply: CF → internet costs less than S3 → internet.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad

  # ----- Compute ------------------------------------------------------------
  AudioWatermarkFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      # 2048 MB ≈ 1.2 vCPU — roughly doubles transcode speed vs 1024 so a
      # full-length chapter finishes inside API Gateway's hard 29 s timeout.
      MemorySize: 2048
      # Default /tmp is 512 MB. Watermarking builds a full-length intermediate
      # WAV (a ~45-min mono master ≈ 230 MB, stereo ≈ 470 MB) plus the source
      # master and the output MP3 — which overflows 512 MB and makes ffmpeg fail
      # with "No space left on device". 2 GB leaves comfortable headroom.
      EphemeralStorage:
        Size: 2048
      Timeout: 60
      Tracing: Active        # X-Ray — free tier 100 k traces/month; SAM adds the layer
      Architectures:
        - x86_64        # change to arm64 to run on Graviton (cheaper, faster on Apple Silicon)
      Environment:
        Variables:
          BUCKET_NAME: !Ref AudioBucket
          CF_DOMAIN: !GetAtt CloudFrontDistribution.DomainName
          CF_KEY_ID: !GetAtt CloudFrontPublicKey.Id
          CF_PRIVATE_KEY_PARAM: !Ref CFPrivateKeyParam
      Policies:
        # Least-privilege S3 access — no DeleteObject, no ListBucket.
        # GetObject: download masters + generate presigned GETs for orders/
        # PutObject: upload buyer MP3s (orders/) + generate presigned PUTs (masters/)
        # HeadObject: idempotency check (object_exists) on orders/
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource:
                - !Sub "arn:aws:s3:::${AudioBucket}/masters/*"
                - !Sub "arn:aws:s3:::${AudioBucket}/orders/*"
            - Effect: Allow
              Action: s3:PutObject
              Resource:
                - !Sub "arn:aws:s3:::${AudioBucket}/masters/*"
                - !Sub "arn:aws:s3:::${AudioBucket}/orders/*"
            - Effect: Allow
              Action: s3:HeadObject
              Resource: !Sub "arn:aws:s3:::${AudioBucket}/orders/*"
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${CFPrivateKeyParam}"
      Events:
        UploadUrlApi:
          Type: Api
          Properties:
            Path: /products/upload-url
            Method: post
            Auth:
              ApiKeyRequired: true
        WatermarkApi:
          Type: Api
          Properties:
            Path: /watermark
            Method: post
            Auth:
              ApiKeyRequired: true
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: latest

  # ----- API key + usage plan -----------------------------------------------
  # API Gateway enforces the key before invoking Lambda — bad requests cost
  # nothing and produce no cold starts.
  # We reference SAM's implicit ServerlessRestApi (not a new explicit resource)
  # so that updating from the old template is an in-place update, not a
  # replacement, which would fail on stacks deployed with disable-rollback.
  WatermarkApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: WatermarkApiKey
      Enabled: true

  WatermarkUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      UsagePlanName: WatermarkUsagePlan
      ApiStages:
        - ApiId: !Ref ServerlessRestApi
          Stage: Prod
      # Rate-limit so a leaked key cannot run unlimited 60-second Lambda invocations.
      # 10 req/s burst / 5 req/s steady is far above normal WooCommerce throughput
      # but caps runaway abuse. Quota: 10 000 calls/day ≈ 1 order every 9 seconds.
      Throttle:
        BurstLimit: 10
        RateLimit: 5
      Quota:
        Limit: 10000
        Period: DAY
    DependsOn: ServerlessRestApiProdStage  # SAM auto-names the stage <ApiLogicalId><StageName>Stage

  WatermarkUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref WatermarkApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref WatermarkUsagePlan

Outputs:
  CloudFrontDomain:
    Description: CloudFront distribution domain for buyer audio delivery
    Value: !GetAtt CloudFrontDistribution.DomainName
  BucketName:
    Description: S3 bucket for master and watermarked audio
    Value: !Ref AudioBucket
  FunctionName:
    Description: Lambda function name (used by scripts/smoke-test.sh)
    Value: !Ref AudioWatermarkFunction
  ApiBaseUrl:
    Description: Base URL for the watermarking API (configure this in the WooCommerce plugin)
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  ApiEndpoint:
    Description: POST endpoint for watermark requests
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/watermark"
  ApiKeyId:
    Description: "Retrieve the key value with: aws apigateway get-api-keys --include-values --query \"items[?name=='WatermarkApiKey'].value\" --output text"
    Value: !Ref WatermarkApiKey
