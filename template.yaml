AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Forensic audio watermarking service — watermarks audiobooks with a buyer user_id

# This template provisions EVERYTHING the service needs so the only manual step
# left after `sam deploy` is clicking the SES verification link in your inbox:
#   - S3 bucket (private, with temp/ auto-expiry)
#   - SES sender identity (email verification)
#   - the watermarking Lambda (container image) with least-privilege IAM
#   - an API Gateway POST /watermark endpoint
#
# Deploy with the helper script:  ./scripts/deploy.sh

Parameters:
  SesFromEmail:
    Type: String
    Description: >
      Sender email address. SES emails a verification link here on first deploy;
      until you click it, no mail can be sent from this address.

Resources:
  # ----- Storage ------------------------------------------------------------
  AudioBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          # Watermarked outputs are throwaway: the presigned link lasts 48h, so
          # there is no reason to keep them. Auto-delete after 2 days to control cost.
          - Id: ExpireTempWatermarks
            Status: Enabled
            Prefix: temp/
            ExpirationInDays: 2

  # ----- Presigner IAM user ---------------------------------------------------
  # Lambda execution-role credentials are STS temporary (ASIA...) and expire in
  # ≤12 h. A presigned URL signed with them becomes invalid after that — even
  # though the URL's own Expires is 48 h. This dedicated IAM user has permanent
  # credentials (AKIA...) so presigned URLs remain valid for their full lifetime.
  # Permissions are scoped to s3:GetObject on temp/ only (read-only, one prefix).
  PresignerUser:
    Type: AWS::IAM::User
    Properties:
      Policies:
        - PolicyName: S3GetObjectTempOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${AudioBucket}/temp/*"

  PresignerAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref PresignerUser

  # ----- Email --------------------------------------------------------------
  SenderIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref SesFromEmail

  # ----- Compute ------------------------------------------------------------
  AudioWatermarkFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      MemorySize: 1024
      Timeout: 60
      Architectures:
        - x86_64        # change to arm64 to run on Graviton (cheaper, faster on Apple Silicon)
      Environment:
        Variables:
          BUCKET_NAME: !Ref AudioBucket
          SES_FROM_EMAIL: !Ref SesFromEmail
          PRESIGNER_KEY_ID: !Ref PresignerAccessKey
          PRESIGNER_SECRET: !GetAtt PresignerAccessKey.SecretAccessKey
      Policies:
        # Read masters + write watermarked outputs, scoped to this bucket only.
        - S3CrudPolicy:
            BucketName: !Ref AudioBucket
        # Send the download-link email. SES SendEmail does not support
        # resource-level scoping cleanly, so this is action-scoped.
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'
      Events:
        WatermarkApi:
          Type: Api
          Properties:
            Path: /watermark
            Method: post
            Auth:
              ApiKeyRequired: true  # enforced on the implicit ServerlessRestApi — avoids replacing Lambda::Permission
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: latest

  # ----- API key + usage plan -----------------------------------------------
  # API Gateway enforces the key before invoking Lambda — bad requests cost
  # nothing and produce no cold starts.
  # We reference SAM's implicit ServerlessRestApi (not a new explicit resource)
  # so that updating from the old template is an in-place update, not a
  # replacement, which would fail on stacks deployed with disable-rollback.
  WatermarkApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: WatermarkApiKey
      Enabled: true

  WatermarkUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      UsagePlanName: WatermarkUsagePlan
      ApiStages:
        - ApiId: !Ref ServerlessRestApi
          Stage: Prod
    DependsOn: ServerlessRestApiProdStage  # SAM auto-names the stage <ApiLogicalId><StageName>Stage

  WatermarkUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref WatermarkApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref WatermarkUsagePlan

Outputs:
  BucketName:
    Description: S3 bucket for master and watermarked audio
    Value: !Ref AudioBucket
  FunctionName:
    Description: Lambda function name (used by scripts/smoke-test.sh)
    Value: !Ref AudioWatermarkFunction
  ApiEndpoint:
    Description: POST endpoint for watermark requests
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/watermark"
  ApiKeyId:
    Description: "Retrieve the key value with: aws apigateway get-api-keys --include-values --query \"items[?name=='WatermarkApiKey'].value\" --output text"
    Value: !Ref WatermarkApiKey
