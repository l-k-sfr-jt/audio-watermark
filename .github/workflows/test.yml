# Run the unit + robustness test suite on every push and pull request.
# ffmpeg is installed from the Ubuntu package repository so all tests run,
# including the MP3 64 kbps / 128 kbps roundtrip tests.
# No AWS credentials are required — all tests are local.

name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # ffmpeg is needed for: MP3 decode in _load_head(), tail-stitching in
      # embed_watermark() for signals longer than _REQUIRED samples, and the
      # MP3 64/128 kbps roundtrip tests.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v
